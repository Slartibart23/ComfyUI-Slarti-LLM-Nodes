[project]
name = "slarti-llm-nodes"
description = "Local GGUF LLM/VLM nodes for ComfyUI (llama.cpp): prompt generation, image captioning and VRAM management, with automatic GPU setup for llama-cpp-python and a prompt library for Krea2/FLUX2 images and MiniMax H3 video."
version = "2.0.1"
license = { file = "LICENSE" }
# llama-cpp-python is intentionally NOT listed here: a plain pip install gives a
# CPU-only build. The GPU build is installed automatically by llama_bootstrap.py.
dependencies = []

[project.urls]
Repository = "https://github.com/Slartibart23/ComfyUI-Slarti-LLM-Nodes"
"Bug Tracker" = "https://github.com/Slartibart23/ComfyUI-Slarti-LLM-Nodes/issues"

[tool.comfy]
PublisherId = "slartibart23b"
DisplayName = "Slarti LLM Nodes (GGUF)"
